<head>

<title>Medellin Gourmet 2026 — Ranking</title>
<style>
:root {
  --bg: #0f0f0f; --card: #1a1a2e; --accent: #e94560;
  --gold: #f5c518; --text: #eee; --muted: #888;
  --border: #2a2a4a; --input-bg: #1e1e3f;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height:100vh; padding-bottom:80px; }
.header { background: linear-gradient(135deg, #1a1a2e 0%, #0a0a1a 100%);
  padding:20px 16px; text-align:center; border-bottom:2px solid var(--accent);
  position:sticky; top:0; z-index:100; }
.header h1 { font-size:1.4em; margin-bottom:4px; }
.header h1 span { color: var(--accent); }
.header .sub { color: var(--muted); font-size:0.85em; }
.stats-bar { display:flex; gap:12px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
.stat { background:var(--card); padding:4px 10px; border-radius:12px; font-size:0.78em; }
.stat b { color: var(--gold); }
.filters { padding:12px 16px; background:var(--card); border-bottom:1px solid var(--border);
  position:sticky; top:88px; z-index:99; }
.filter-row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.filter-row:last-child { margin-bottom:0; }
input[type="text"], select { background:var(--input-bg); border:1px solid var(--border);
  color:var(--text); padding:8px 12px; border-radius:8px; font-size:0.9em; flex:1; min-width:0; }
input::placeholder { color: var(--muted); }
select { cursor:pointer; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { background:var(--input-bg); border:1px solid var(--border); color:var(--muted);
  padding:5px 12px; border-radius:20px; font-size:0.78em; cursor:pointer;
  transition:all 0.2s; white-space:nowrap; }
.chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.chip:hover { border-color:var(--accent); }
.sort-bar { padding:8px 16px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.sort-bar span { color:var(--muted); font-size:0.8em; }
.sort-btn { background:var(--card); border:1px solid var(--border); color:var(--muted);
  padding:4px 10px; border-radius:6px; font-size:0.75em; cursor:pointer; }
.sort-btn.active { color:var(--gold); border-color:var(--gold); }
.results-count { padding:4px 16px; color:var(--muted); font-size:0.82em; }
.cards { padding:0 12px; }
.card { background:var(--card); border-radius:12px; margin-bottom:12px;
  border:1px solid var(--border); overflow:hidden; transition:border-color 0.2s; }
.card:hover { border-color:var(--accent); }
.card-top3 { border-color:var(--gold); }
.card-header { padding:14px 16px; cursor:pointer; }
.rank-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.rank-badge { font-size:1.3em; min-width:32px; text-align:center; }
.rank-num { background:var(--accent); color:#fff; width:28px; height:28px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:0.8em; font-weight:700; min-width:28px; }
.rest-name { font-size:1.05em; font-weight:600; flex:1; }
.score-bar-wrap { margin:8px 0; }
.score-bar { height:6px; background:#2a2a4a; border-radius:3px; overflow:hidden; }
.score-fill { height:100%; border-radius:3px;
  background: linear-gradient(90deg, var(--accent), var(--gold)); transition:width 0.5s; }
.score-label { display:flex; justify-content:space-between; margin-top:3px; }
.score-num { font-size:0.85em; font-weight:700; color:var(--gold); }
.score-detail { font-size:0.7em; color:var(--muted); }
.ratings-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; align-items:center; }
.rating-badge { display:inline-flex; align-items:center; gap:3px; padding:3px 8px;
  border-radius:6px; font-size:0.8em; font-weight:600; }
.rating-google { background:#1a3a1a; color:#81c784; }
.meta-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
.meta { font-size:0.8em; color:var(--muted); }
.meta b { color:var(--text); font-weight:500; }
.precio-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
.precio-tag { padding:3px 10px; border-radius:6px; font-size:0.82em; font-weight:600; }
.p89 { background:#1b5e20; color:#a5d6a7; }
.p119 { background:#0d47a1; color:#90caf9; }
.p159 { background:#4a148c; color:#ce93d8; }
.p209 { background:#b71c1c; color:#ef9a9a; }
.ahorro-badge { display:inline-flex; align-items:center; gap:4px;
  background:linear-gradient(135deg, #1b5e20, #2e7d32); color:#a5d6a7;
  padding:3px 10px; border-radius:6px; font-size:0.82em; font-weight:700; }
.card-body { padding:0 16px 14px; display:none; }
.card.open .card-body { display:block; }
.platos-section { margin-top:10px; }
.curso-title { color:var(--accent); font-size:0.85em; font-weight:600;
  margin-top:10px; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; }
.plato { padding:4px 0; border-bottom:1px solid #1a1a2e; }
.plato-name { font-size:0.88em; font-weight:500; }
.plato-desc { font-size:0.78em; color:var(--muted); margin-top:2px; }
.links { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.link-btn { display:inline-flex; align-items:center; gap:4px;
  padding:6px 14px; border-radius:8px; font-size:0.82em; text-decoration:none;
  font-weight:500; transition:opacity 0.2s; }
.link-btn:hover { opacity:0.8; }
.link-wa { background:#25d366; color:#fff; }
.link-ig { background:linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color:#fff; }
.link-web { background:var(--accent); color:#fff; }
.link-map { background:#4285f4; color:#fff; }
.tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }
.tag { background:var(--input-bg); color:var(--muted); padding:2px 8px;
  border-radius:4px; font-size:0.72em; }
.empty { text-align:center; padding:40px 20px; color:var(--muted); }
.empty .big { font-size:2em; margin-bottom:10px; }
.formula { font-size:0.72em; color:var(--muted); text-align:center; padding:6px 16px;
  background:var(--card); border-bottom:1px solid var(--border); }
.formula b { color:var(--text); }
@media (min-width:768px) {
  .cards { max-width:700px; margin:0 auto; }
  .header,.filters,.sort-bar,.results-count,.formula { max-width:700px; margin-left:auto; margin-right:auto; }
}
</style>
</head>

const W={rg:.35,ah:.25,nrg:.15,va:.15,ca:.05};
function calcScore(r){
  const sRg=(r.rg/5)*100;
  const sAh=Math.min((r.ah/76)*100,100);
  const sNrg=(Math.min(r.nrg,3000)/3000)*100;
  const sVa=(Math.min(r.np,20)/20)*100;
  const sCa=(r.cs.length/5)*100;
  const total=W.rg*sRg+W.ah*sAh+W.nrg*sNrg+W.va*sVa+W.ca*sCa;
  return{total,sRg,sAh,sNrg,sVa,sCa};
}
function fmt(p){return '$'+p.toLocaleString('es-CO');}
function precioClass(p){if(p<=89000)return'p89';if(p<=119000)return'p119';if(p<=159000)return'p159';return'p209';}
let currentSort='score',currentPrecio=null,openCards=new Set();
function init(){
  if(!DATA)return;
  const{r,z,t}=DATA;
  r.forEach(x=>{const s=calcScore(x);x._score=s.total;x._s=s;});
  const zSel=document.getElementById('zonaSelect');
  z.forEach(zona=>{const o=document.createElement('option');o.value=zona;o.textContent=zona;zSel.appendChild(o);});
  const tSel=document.getElementById('tipoSelect');
  t.forEach(tipo=>{const o=document.createElement('option');o.value=tipo;o.textContent=tipo;tSel.appendChild(o);});
  const conG=r.filter(x=>x.rg>0).length;
  document.getElementById('statsBar').innerHTML=
    `<div class="stat"><b>${r.length}</b> restaurantes</div>`+
    `<div class="stat"><b>${conG}</b> con Google</div>`+
    `<div class="stat"><b>${t.length}</b> tipos</div>`;
  document.getElementById('searchInput').addEventListener('input',render);
  zSel.addEventListener('change',render);
  tSel.addEventListener('change',render);
  document.querySelectorAll('.chip[data-precio]').forEach(c=>{
    c.addEventListener('click',()=>{
      const p=parseInt(c.dataset.precio);
      if(currentPrecio===p){currentPrecio=null;c.classList.remove('active');}
      else{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));currentPrecio=p;c.classList.add('active');}
      render();
    });
  });
  document.querySelectorAll('.sort-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.sort-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');currentSort=b.dataset.sort;render();
    });
  });
  render();
}
function matchSearch(r,q){
  if(!q)return true;
  const terms=q.toLowerCase().split(/\s+/);
  const hay=[r.n,r.tc,r.z,r.dir,...r.pl.map(p=>p.n+' '+(p.d||''))].join(' ').toLowerCase();
  return terms.every(t=>hay.includes(t));
}
function render(){
  const{r}=DATA;
  const q=document.getElementById('searchInput').value.trim();
  const zona=document.getElementById('zonaSelect').value;
  const tipo=document.getElementById('tipoSelect').value;
  let f=r.filter(x=>{
    if(!matchSearch(x,q))return false;
    if(zona&&x.z!==zona)return false;
    if(tipo&&!x.ts.includes(tipo))return false;
    if(currentPrecio&&!x.ps.includes(currentPrecio))return false;
    return true;
  });
  f.forEach(x=>{const s=calcScore(x);x._score=s.total;x._s=s;});
  f.sort((a,b)=>{
    switch(currentSort){
      case'score':return b._score-a._score;
      case'ahorro':return b.ah-a.ah;
      case'google':return(b.rg||0)-(a.rg||0)||(b.nrg||0)-(a.nrg||0);
      case'precio-asc':return(a.ps[0]||0)-(b.ps[0]||0);
      case'platos':return b.np-a.np;
      default:return b._score-a._score;
    }
  });
  document.getElementById('resultsCount').textContent=`${f.length} restaurante${f.length!==1?'s':''} encontrado${f.length!==1?'s':''}`;
  const ct=document.getElementById('cardsList');
  if(!f.length){ct.innerHTML='<div class="empty"><div class="big">🍽️</div>No se encontraron restaurantes con esos filtros.</div>';return;}
  ct.innerHTML=f.map((r,i)=>{
    const rank=i+1;
    const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
    const isTop3=rank<=3,isOpen=openCards.has(r.n),sc=r._score,s=r._s;
    const pt=r.ps.map(p=>`<span class="precio-tag ${precioClass(p)}">${fmt(p)}</span>`).join('');
    let ab='';if(r.ah>0)ab=`<span class="ahorro-badge">🔥 ${Math.round(r.ah)}% ahorro · ahorras ${fmt(r.aa)}</span>`;
    let rt='';
    if(r.rg>0)rt=`<span class="rating-badge rating-google">⭐ Google ${r.rg.toFixed(1)}${r.nrg?` (${r.nrg.toLocaleString()} resenas)`:''}</span>`;
    else rt='<span style="font-size:0.8em;color:var(--muted)">sin datos Google</span>';
    const cu={};r.pl.forEach(p=>{if(!cu[p.c])cu[p.c]=[];cu[p.c].push(p);});
    let ph='';['Entrada','Fuerte','Postre','Bebida'].forEach(c=>{
      if(!cu[c])return;ph+=`<div class="curso-title">${c}</div>`;
      cu[c].forEach(p=>{ph+=`<div class="plato"><div class="plato-name">${esc(p.n)}</div>${p.d?`<div class="plato-desc">${esc(p.d)}</div>`:''}</div>`;});
    });
    let lk='';
    if(r.wa)lk+=`<a href="${r.wa}" target="_blank" class="link-btn link-wa">📱 WhatsApp</a>`;
    if(r.ig)lk+=`<a href="${r.ig}" target="_blank" class="link-btn link-ig">📸 Instagram</a>`;
    if(r.u)lk+=`<a href="${r.u}" target="_blank" class="link-btn link-web">🌐 Ver mas</a>`;
    if(r.lat&&r.lng)lk+=`<a href="https://maps.google.com/?q=${r.lat},${r.lng}" target="_blank" class="link-btn link-map">📍 Mapa</a>`;
    const tg=r.cs.map(c=>`<span class="tag">${esc(c)}</span>`).join('');
    return`<div class="card ${isTop3?'card-top3':''} ${isOpen?'open':''}" data-name="${esc(r.n)}">
      <div class="card-header" onclick="toggleCard(this)">
        <div class="rank-row">
          ${medal?`<span class="rank-badge">${medal}</span>`:`<span class="rank-num">${rank}</span>`}
          <span class="rest-name">${esc(r.n)}</span>
          <span style="font-size:0.8em;color:var(--muted)">▼</span>
        </div>
        <div class="score-bar-wrap">
          <div class="score-bar"><div class="score-fill" style="width:${Math.min(sc,100)}%"></div></div>
          <div class="score-label">
            <span class="score-num">${sc.toFixed(1)} pts</span>
            <span class="score-detail">G:${Math.round(s.sRg)} Ah:${Math.round(s.sAh)} Pop:${Math.round(s.sNrg)} Var:${Math.round(s.sVa)} Ex:${Math.round(s.sCa)}</span>
          </div>
        </div>
        <div class="ratings-row">${rt}</div>
        <div class="meta-row">
          <span class="meta">🍽️ <b>${r.np}</b> platos</span>
          ${r.z?`<span class="meta">📍 <b>${esc(r.z)}</b></span>`:''}
          ${r.tc?`<span class="meta">🥘 ${esc(r.tc)}</span>`:''}
        </div>
        <div class="precio-tags">${pt} ${ab}</div>
      </div>
      <div class="card-body">
        ${r.dir?`<div style="font-size:0.82em;color:var(--muted);margin-bottom:8px">📌 ${esc(r.dir)}</div>`:''}
        ${tg?`<div class="tags">${tg}</div>`:''}
        ${lk?`<div class="links">${lk}</div>`:''}
        ${ph?`<div class="platos-section">${ph}</div>`:''}
      </div>
    </div>`;
  }).join('');
}
function toggleCard(h){const c=h.parentElement;const n=c.dataset.name;c.classList.toggle('open');if(c.classList.contains('open'))openCards.add(n);else openCards.delete(n);}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
document.addEventListener('DOMContentLoaded',init);
</script>
